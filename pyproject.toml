[project]
name = "template"
version = "0.0.1"
description = "Template for creating new python packages"
authors = [{ name = "Reuben Brasher", email = "rkbrasher@gmail.com" }]
license = "MIT"
readme = "README.md"
# Upper bound is required: Poetry cannot resolve dependencies that cap
# themselves at <4.0 against an unbounded range. Equivalent to the old
# Poetry-style `python = "^3.11"`.
requires-python = ">=3.11,<4.0"
dependencies = []

[tool.poetry]
packages = [{ include = "template" }]
# Non-package paths reach the SOURCE DISTRIBUTION only. Poetry does not copy
# files from outside the package directory into a wheel, so data/ and README.md
# ship in the sdist and nowhere else. Anything that must be importable from an
# installed wheel has to live inside template/ (see directories.package_data).
include = ["data/*", "README.md"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
coverage = "^7.16.0"
ruff = "^0.16.7"
vulture = "^2.16"
deptry = "^0.25.1"

# Optional: NOT installed by a plain `poetry install`.
# Use `poetry install --with notebook` when you need it.
[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
jupyter = "^1.1.1"
jupyterlab = "^4.6.3"
matplotlib = "^3.11.2"
seaborn = "^0.13.2"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (includes E402 import placement, F401 unused
# imports). I: import sorting. UP: pyupgrade. ERA001: commented-out code.
# ARG is deliberately NOT enabled -- unused arguments are usually signature
# contracts in interface implementations, not dead code.
select = ["E", "F", "I", "UP", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_version.py" = ["F841"]
# A vulture baseline is a list of bare names, so every line is an undefined
# reference. See `make deadcode` for when this file exists.
"deadcode-whitelist.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["template/tests"]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.deptry]
# The test suite imports pytest, which is correctly a dev dependency.
[tool.deptry.per_rule_ignores]
DEP004 = ["pytest"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
